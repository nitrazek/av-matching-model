[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "av-matching-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clip",
    "pillow>=12.1.1",
    "torch==2.9.0",
    "librosa>=0.11.0",
    "pytest>=9.0.3",
    "torchaudio==2.9.0",
    "transformers>=5.5.4",
    "torchvision==0.24.0",
    "av>=17.0.1",
    "torchcodec==0.9.1",
    "tqdm>=4.67.3",
    "mlflow>=3.12.0",
]

[project.scripts]
avmodel = "src.cli.main:main"

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
clip = { git = "https://github.com/openai/CLIP.git" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
